services:
  # Backend API Service (Node.js / Express)
  - type: web
    name: knowledge-track-server
    env: node
    region: ohio
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        value: knowledgetrack_jwt_secret_production_key_2026
      - key: JWT_EXPIRES_IN
        value: 7d

  # Frontend Static Site Service (React / Vite)
  - type: web
    name: knowledge-track-client
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: knowledge-track-server
          property: host
