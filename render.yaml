services:
  # Backend API Service (Node.js / Express)
  - type: web
    name: knowledge-track-server
    env: node
    region: ohio # You can change to frankfurt, oregon, etc.
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false # Set this securely in your Render dashboard settings

  # Frontend Static Site Service (React / Vite)
  - type: web
    name: knowledge-track-client
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: knowledge-track-server
          property: host
